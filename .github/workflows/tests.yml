name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Validates the loader (tests_loader.py) and the structure of every
      # certified device config: ReadAttributes / ConfigureReporting shape,
      # database layout and model-name uniqueness.
      - name: Run test suite
        run: pytest

      - name: Lint Python
        run: flake8 z4d_certified_devices tests

  # A readable summary of the whole certified database, for the cases where the
  # suite is green but a device config still carries a known, baselined issue.
  certified_report:
    name: Certified database report
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report ReadAttributes / ConfigureReporting findings
        run: |
          {
            echo '## Certified database structural report'
            echo
            echo 'Findings recorded in `tests/certified_baseline.json`. Anything *not* listed there fails the `Tests` job.'
            echo
            echo '```'
            python tests/certified_schema.py --report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
